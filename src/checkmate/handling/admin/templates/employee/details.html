{{! Employee details fragment }}
<div class="mx-auto max-w-2xl">
  <div class="mb-6 flex items-center gap-3">
    <button class="btn btn-ghost btn-sm"
            hx-get="/checkmate/admin/employee"
            hx-target="#main-content"
            hx-swap="innerHTML">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
      </svg>
    </button>
    <div>
      <h1 class="text-3xl font-bold">Detalles del empleado</h1>
      <p class="mt-1 text-sm opacity-60">Información registrada en el sistema</p>
    </div>
  </div>

  <div class="rounded-xl bg-base-100 shadow">
    <div class="flex items-center gap-4 border-b border-base-300 p-6">
      <div class="avatar placeholder">
        <div class="flex h-16 w-16 items-center justify-center rounded-full bg-secondary text-secondary-content">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-9 w-9">
            <path fill-rule="evenodd" d="M7.5 6a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM3.751 20.105a8.25 8.25 0 0116.498 0 .75.75 0 01-.437.695A18.683 18.683 0 0112 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 01-.437-.695z" clip-rule="evenodd" />
          </svg>
        </div>
      </div>
      <div>
        <div class="text-xl font-bold">{{name}}</div>
        <div class="mt-1"><span class="badge badge-secondary badge-sm">{{document_type_display}}</span></div>
      </div>
    </div>

    <div class="divide-y divide-base-300">
      <div class="flex items-center justify-between px-6 py-4">
        <span class="text-sm opacity-60">Número de documento</span>
        <span class="font-mono font-medium">{{document_number}}</span>
      </div>
      <div class="flex items-center justify-between px-6 py-4">
        <span class="text-sm opacity-60">Tipo de documento</span>
        <span class="font-medium">{{document_type_display}}</span>
      </div>
      <div class="flex items-center justify-between px-6 py-4">
        <span class="text-sm opacity-60">Fecha de registro</span>
        <span class="text-sm">{{created_at}}</span>
      </div>
    </div>

    <div class="flex justify-end gap-2 border-t border-base-300 p-6">
      <button class="btn btn-error btn-outline btn-sm"
              hx-post="/checkmate/admin/employee/{{rowid}}/delete"
              hx-target="#main-content"
              hx-swap="innerHTML"
              hx-confirm="¿Eliminar a {{name}}? Esta acción no se puede deshacer.">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
        </svg>
        Eliminar
      </button>
      <button class="btn btn-secondary btn-sm"
              hx-get="/checkmate/admin/employee/{{rowid}}/update"
              hx-target="#main-content"
              hx-swap="innerHTML">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
        </svg>
        Editar
      </button>
    </div>
  </div>
</div>
