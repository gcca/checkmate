{{! Dashboard fragment }}
<div class="mx-auto max-w-5xl">
  <div class="mb-6">
    <h1 class="text-3xl font-bold">Dashboard</h1>
    <p class="mt-1 text-sm opacity-60">Resumen del sistema</p>
  </div>

  <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
    <div class="stat rounded-xl bg-base-100 shadow">
      <div class="stat-figure text-secondary">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-8 w-8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
        </svg>
      </div>
      <div class="stat-title">Empleados</div>
      <div class="stat-value text-secondary"
           hx-get="/checkmate/admin/employee"
           hx-trigger="load"
           hx-target="this"
           hx-swap="innerHTML"
           hx-select=".employee-count">
        —
      </div>
      <div class="stat-desc">Registrados en el sistema</div>
    </div>

    <div class="stat rounded-xl bg-base-100 shadow">
      <div class="stat-figure text-primary">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-8 w-8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
      <div class="stat-title">Hora local</div>
      <div class="stat-value text-primary text-2xl" id="clock">—</div>
      <div class="stat-desc" id="clock-date">—</div>
    </div>

    <div class="stat rounded-xl bg-base-100 shadow">
      <div class="stat-figure text-accent">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-8 w-8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
        </svg>
      </div>
      <div class="stat-title">Sistema</div>
      <div class="stat-value text-accent text-2xl">Online</div>
      <div class="stat-desc">CheckMate activo</div>
    </div>
  </div>
</div>

<script>
  (function() {
    function tick() {
      const now = new Date();
      const timeEl = document.getElementById('clock');
      const dateEl = document.getElementById('clock-date');
      if (timeEl) timeEl.textContent = now.toLocaleTimeString('es-PE');
      if (dateEl) dateEl.textContent = now.toLocaleDateString('es-PE', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }
    tick();
    setInterval(tick, 1000);
  })();
</script>
